# Baut bei jedem Versions-Tag (z. B. v0.3.0) ein Release mit system.json und midgard5-cmt.zip.
# Foundry liest das Manifest unter releases/latest/download/system.json und lädt das ZIP
# der jeweiligen Version unter releases/download/vX.Y.Z/midgard5-cmt.zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version im Tag und in system.json vergleichen
        run: |
          VERSION=$(jq -r .version system.json)
          DOWNLOAD=$(jq -r .download system.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $VERSION in system.json"; exit 1
          fi
          case "$DOWNLOAD" in
            *"/releases/download/$GITHUB_REF_NAME/midgard5-cmt.zip") ;;
            *) echo "download in system.json zeigt nicht auf $GITHUB_REF_NAME: $DOWNLOAD"; exit 1 ;;
          esac

      - name: ZIP bauen (Systemdateien direkt im Wurzelverzeichnis)
        run: zip -r midgard5-cmt.zip . -x '.git/*' '.github/*' 'README.md'

      - uses: softprops/action-gh-release@v2
        with:
          name: Midgard-CMT ${{ github.ref_name }}
          files: |
            system.json
            midgard5-cmt.zip
